<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Dojo — болванка</title>
<style>
  :root {
    --bg: #0c0b12;
    --panel: #16141f;
    --line: #2b2840;
    --ink: #e8e6f0;
    --dim: #8b869e;
    --accent: #7bdff2;
    --gold: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex;
    align-items: flex-start;
    padding: 24px;
    gap: 20px;
  }
  h1 {
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0 0 12px;
    font-weight: 500;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    /* Поле не вище за вікно, щоб не доводилось скролити */
    max-height: calc(100vh - 130px);
    background: #12111a;
    border: 1px solid var(--line);
    image-rendering: pixelated;
    margin-inline: auto;
  }
  /* Ігрова зона займає весь вільний простір, панель праворуч фіксована */
  .stage { flex: 1 1 auto; min-width: 0; }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 10px;
    color: var(--dim);
    font-size: 13px;
  }
  .hud b { color: var(--gold); font-size: 20px; font-weight: 600; }
  aside {
    flex: 0 0 280px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 16px;
  }
  ol { list-style: none; margin: 0 0 16px; padding: 0; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  li.empty { color: var(--dim); border: 0; font-size: 13px; }
  .rank { color: var(--dim); width: 1.5em; }
  .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pts { color: var(--gold); }
  input, button {
    font: inherit;
    width: 100%;
    padding: 8px 10px;
    background: #0c0b12;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  button { cursor: pointer; margin-top: 8px; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { color: var(--dim); font-size: 12px; min-height: 2em; margin-top: 8px; }
  .keys { color: var(--dim); font-size: 12px; margin-top: 14px; }

  /* Вузький екран — панель під поле */
  @media (max-width: 900px) {
    body { flex-wrap: wrap; padding: 16px; }
    .stage { flex: 1 1 100%; }
    aside { flex: 1 1 100%; }
    canvas { max-height: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <h1 id="title">Game Dojo — болванка</h1>
  <canvas id="game" tabindex="0"></canvas>
  <div class="hud">
    <span id="controls-hint">WASD / стрілки</span>
    <span><span id="score-label">Очки:</span> <b id="score">0</b></span>
  </div>
</div>

<aside>
  <h1 id="board-title">Топ-10</h1>
  <ol id="board"><li class="empty">Завантаження…</li></ol>
  <input id="name" maxlength="24" placeholder="Твоє імʼя" aria-label="Твоє імʼя">
  <button id="save">Зберегти результат</button>
  <button id="reset">Почати заново</button>
  <p class="status" id="status"></p>
  <p class="keys">Спрайти клади в <code>assets/hero.png</code> — сітка 32×32, рядки: вниз / вліво / вправо / вгору.</p>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
